                  $ref: "#/components/schemas/ManualMetricValue"
    put:
      operationId: upsertManualMetricValue
      tags: [metric-mappings]
      summary: Create or update a manually entered KPI value for a metric/period/territory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualMetricValueInput"
      responses:
        "200":
          description: Saved manual value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualMetricValue"

  /team-targets:
    get:
      operationId: listTeamTargets
      tags: [metric-targets]
      summary: Stage 6.2 Team/My Targets grid -- one row per (canonically-owned territory, targetable metric) for the selected period, with target, actual (from the same canonical KPI computation as Overview), and progress. Rows with no target configured yet are included (target_value/target_id null) so Head/Admin can create one directly. A PAM is always forced to their own (territory, PAM) scope regardless of query params; Head/Admin may filter.
      parameters:
        - name: period
          in: query
          schema:
            type: ["string", "null"]
        - name: pam_user_id
          in: query
          schema:
            type: ["string", "null"]
          description: Head/Admin only -- ignored for a PAM caller.
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
          description: Head/Admin only (id or name) -- ignored for a PAM caller.
      responses:
        "200":
          description: Team Targets grid
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamTargetRow"
        "403":
          description: Caller has no canonical territory assigned

  /metric-targets:
    get:
      operationId: listMetricTargets
      tags: [metric-targets]
      summary: List management-configured KPI targets. A PAM sees only their own territory; a global/admin user sees all.
      parameters:
        - name: metric_key
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of configured targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricTarget"
    put:
      operationId: upsertMetricTarget
      tags: [metric-targets]
      summary: Create or update the target for a metric/period/PAM/territory. Head of Channels/admin only -- never changes the metric's actual value. pam_user_id must be territory_id's canonical owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricTargetInput"
      responses:
        "200":
          description: Saved target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricTarget"
        "400":
          description: pam_user_id does not canonically own territory_id, or metric_key is not a targetable metric
        "404":
          description: Unknown territory_id or pam_user_id

  /metric-targets/{id}:
    delete:
      operationId: deleteMetricTarget
      tags: [metric-targets]
      summary: Clear a configured target back to unconfigured (honest null). Head of Channels/admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /metric-targets/annual:
    get:
      operationId: getAnnualTarget
      tags: [metric-targets]
      summary: Phase 5A -- get the company-wide annual target (Irina/Head-level) for a metric/year, or null if unset. "annual" is a genuine third target-period value distinct from q1-q4; it is never the same concept as the "ytd" reporting period.
      parameters:
        - name: metric_key
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: The annual target row, or null if none is configured yet
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AnnualTarget"
                  - type: "null"
    put:
      operationId: upsertAnnualTarget
      tags: [metric-targets]
      summary: Create or update the company-wide annual target for a metric/year. Head of Channels/admin only. Deliberately does not divide the annual figure across quarters or PAMs -- PAM quarterly allocations remain separate rows written via PUT /metric-targets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnualTargetInput"
      responses:
        "200":
          description: Saved annual target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnualTarget"
        "404":
          description: metric_key is not a targetable metric

  /metric-targets/annual-cascade:
    get:
      operationId: getAnnualCascade
      tags: [metric-targets]
      summary: Phase 5A -- the full annual target cascade for a metric/year -- Head of Channels/admin only (exposes every PAM's individual quarterly allocations, not just the caller's own). Rolls up annual_target, allocated_to_pams (never annual_target / 4 -- the two are independently derived and compared), unallocated_amount, overallocated_amount, quarterly allocation totals, actual company-wide performance, and attainment percent.
      parameters:
        - name: metric_key
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Annual cascade roll-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnualCascade"
        "404":
          description: metric_key is not a targetable metric

  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List partner opportunities (the commercial deal ledger). A PAM sees only opportunities in their own canonical territory and assigned to themselves; Head of Channels/admin see all.
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [open, won, lost, null]
        - name: attribution_type
          in: query
          schema:
            type: ["string", "null"]
            enum: [partner_sourced, partner_influenced, null]
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
            description: Head/Admin only (id or name) -- ignored for a PAM caller, who is always forced to their own territory.
      responses:
        "200":
          description: List of opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [opportunities]
      summary: Create a new partner opportunity. A PAM may only create in their own canonical territory, assigned to themselves; Head/Admin may create for any valid PAM/territory. status=won requires closed_at.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          description: Invalid input, e.g. status=won without closed_at, or a non-positive deal_value/credit_value
        "403":
          description: PAM attempted to create outside their own territory or assign to a different PAM

  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get a single opportunity. A PAM may only read their own (own territory + own assignment); Head/Admin may read any.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "403":
          description: Caller does not have access to this opportunity
        "404":
          description: Not found
    patch:
      operationId: updateOpportunity
      tags: [opportunities]
      summary: Edit an opportunity. A PAM may only update their own (own territory + own assignment), may never reassign it to another PAM, and may never widen its territory scope. Head/Admin may update any field for any opportunity. status=won requires closed_at (existing or provided in the same request).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityEditInput"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          description: Invalid input, e.g. status=won without closed_at, or a non-positive deal_value/credit_value
        "403":
          description: Caller does not have access to this opportunity, attempted to reassign it to another PAM, or attempted to widen its territory scope
        "404":
          description: Not found

