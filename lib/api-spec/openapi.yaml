          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edit a user's role, territory, or active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEditInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset access for a PAM by generating a new strong temporary password, invalidating the old one, and returning it once
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Temporary password generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResetPasswordResponse"
        "400":
          description: Target user is not a PAM
        "404":
          description: Not found

  /territories/{id}:
    patch:
      operationId: updateTerritory
      tags: [territories]
      summary: Edit a territory's name or owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerritoryEditInput"
      responses:
        "200":
          description: Updated territory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Territory"
        "404":
          description: Not found
        "409":
          description: owner_user_id targets a territory already owned by a different PAM

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List existing partners (accepted/pushed-to-HubSpot prospects)
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"

  /partners/{id}:
    get:
      operationId: getPartner
      tags: [partners]
      summary: Get a partner research briefing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Partner detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDetail"
        "404":
          description: Not found

  /partners/{id}/help-needed:
    patch:
      operationId: updatePartnerHelpNeeded
      tags: [partners]
      summary: Update what help a PAM needs to move a partner forward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpNeededInput"
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          description: Not found

  /prospects/stats/summary:
    get:
      operationId: getProspectStats
      tags: [prospects]
      summary: Get prospect statistics grouped by territory and status
      responses:
        "200":
          description: Prospect statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectStats"

  /prospects/activity/recent:
    get:
      operationId: listRecentProspectActivity
      tags: [prospects]
      summary: Phase 4 -- recent prospect_activity entries, scoped to the caller's own assigned prospects (PAM) or unscoped (Head/Admin). Powers the PAM Overview "Your Actions" recent-activity feed.
      parameters:
        - name: days
          in: query
          description: How many days back to include. Defaults to 7 (a rolling 7-day window, not calendar "this week").
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Recent activity, newest first, bounded to a small fixed count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentProspectActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, role, territory, location_label, timezone, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [head_of_channels, pam, admin]
        territory:
          type: ["string", "null"]
        location_label:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
          description: IANA zone name, e.g. "Europe/Bucharest". Null until explicitly configured -- never inferred from territory/country.
        active:
          type: boolean

    Territory:
      type: object
      required: [id, name, countries, languages]
      properties:
        id:
          type: string
        name:
          type: string
        owner_user_id:
          type: ["string", "null"]
        countries:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string

    Signal:
      type: object
      required: [id, company_id, signal_type, title, summary, source_url, confidence, discovered_at]
      properties:
        id:
          type: string
        company_id:
          type: string
        signal_type:
          type: string
          enum: [partnership, ai_investment, enterprise_access, technology, hiring, event, tender]
        title:
          type: string
        summary:
          type: string
        source_url:
          type: string
        source_domain:
          type: ["string", "null"]
        published_at:
          type: ["string", "null"]
        discovered_at:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        raw_excerpt:
          type: ["string", "null"]

    Company:
      type: object
      required: [id, name, domain, country]
      properties:
        id:
          type: string
        name:
          type: string
        normalized_name:
          type: ["string", "null"]
        domain:
          type: string
        website_url:
          type: ["string", "null"]
        country:
          type: string
        headquarters:
          type: ["string", "null"]
        employee_band:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        linkedin_url:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]

    Prospect:
      type: object
      required: [id, company, territory_id, partner_type, priority, status, why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, created_at]
      properties:
        id:
          type: string
        company:
          $ref: "#/components/schemas/Company"
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          description: >-
            Null for a Discovery prospect that has not yet been explicitly
            assigned by Head of Channels/Admin (see persistCandidate --
            newly discovered prospects start unassigned, never auto-handed
            to the territory's PAM).
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        partner_type:
          type: string
        priority:
          type: string
          enum: [A, B]
        enterprise_access:
          type: boolean
        relevant_capability:
          type: boolean
        technology_adjacency:
          type: boolean
        partnership_openness:
          type: boolean
        recent_trigger:
          type: boolean
        priority_rationale:
          type: ["string", "null"]
          description: The literal spec-section-10 rule that produced this prospect's priority at discovery time.
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
        suggested_message:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, accepted, rejected, deferred, pushed_to_hubspot]
        rejection_reason:
          type: ["string", "null"]
        pam_note:
          type: ["string", "null"]
        accepted_at:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]
        signal_count:
          type: number
        freshness_days:
          type: ["number", "null"]
          description: Days since the most recent evidence or update on this prospect.
        is_stale:
          type: boolean
          description: freshness_days exceeds the territory's scan config recency window.
        next_action:
          $ref: "#/components/schemas/ProspectNextAction"
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]

    ProspectNextAction:
      type: string
      enum: [review, refresh_evidence, send_to_hubspot, none]

    ProspectDetail:
      type: object
      required: [id, company, territory_id, partner_type, priority, status, why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, signals, activity, created_at]
      properties:
        id:
          type: string
        company:
          $ref: "#/components/schemas/Company"
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          description: >-
            Null for a Discovery prospect that has not yet been explicitly
            assigned by Head of Channels/Admin.
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        partner_type:
          type: string
        priority:
          type: string
          enum: [A, B]
        enterprise_access:
          type: boolean
        relevant_capability:
          type: boolean
        technology_adjacency:
          type: boolean
        partnership_openness:
          type: boolean
        recent_trigger:
          type: boolean
        priority_rationale:
          type: ["string", "null"]
          description: The literal spec-section-10 rule that produced this prospect's priority at discovery time.
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
        suggested_message:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, accepted, rejected, deferred, pushed_to_hubspot]
        rejection_reason:
          type: ["string", "null"]
        pam_note:
          type: ["string", "null"]
        accepted_at:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]
        freshness_days:
          type: ["number", "null"]
          description: Days since the most recent evidence or update on this prospect.
        is_stale:
          type: boolean
          description: freshness_days exceeds the territory's scan config recency window.
        next_action:
          $ref: "#/components/schemas/ProspectNextAction"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]

    ActivityItem:
      type: object
      required: [id, event_type, timestamp]
      properties:
        id:
          type: string
        event_type:
          type: string
          enum: [discovered, reviewed, accepted, rejected, deferred, hubspot_pushed, note_added]
        timestamp:
          type: string
        actor_name:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    # Phase 4: same shape as ActivityItem, plus which prospect/company the
    # entry belongs to -- needed because this is a cross-prospect feed
    # (ActivityItem is always read nested under one already-known prospect).
    RecentProspectActivityItem:
      type: object
      required: [id, prospect_id, company_name, event_type, timestamp]
      properties:
        id:
          type: string
        prospect_id:
          type: string
        company_name:
          type: string
        event_type:
          type: string
          enum: [discovered, reviewed, accepted, rejected, deferred, hubspot_pushed, note_added]
        timestamp:
          type: string
        actor_name:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    RecruitmentStage:
      type: string
      enum: [accepted, contacting, engaged, agreement, signed, on_hold, not_pursuing]

    NotPursuingReason:
      type: string
      enum: [no_strategic_fit, no_capacity, competitor_conflict, no_response, geography_mismatch, other]

    RecruitmentNextStageAction:
      type: object
      required: [stage, label]
      description: Server-derived stage-appropriate action (e.g. accepted -> "Start outreach"). Null when the recruitment is in a terminal or exception state with no single forward action.
      properties:
        stage:
          $ref: "#/components/schemas/RecruitmentStage"
        label:
          type: string

    Recruitment:
      type: object
      required: [id, prospect_id, company, territory_id, priority, partner_type, stage, days_in_stage, is_stalled, stage_entered_at, created_at, updated_at]
      properties:
        id:
          type: string
        prospect_id:
          type: string
        company:
          type: object
          required: [id, name, domain]
          properties:
            id:
              type: string
            name:
              type: string
            domain:
              type: string
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        priority:
          type: string
          enum: [A, B]
        partner_type:
          type: string
        stage:
          $ref: "#/components/schemas/RecruitmentStage"
        previous_stage:
          oneOf:
            - $ref: "#/components/schemas/RecruitmentStage"
            - type: "null"
        not_pursuing_reason:
          oneOf:
            - $ref: "#/components/schemas/NotPursuingReason"
            - type: "null"
        next_step:
          type: ["string", "null"]
        follow_up_date:
          type: ["string", "null"]
        days_in_stage:
          type: number
        is_stalled:
          type: boolean
          description: True when stage is one of accepted/contacting/engaged/agreement and days_in_stage > 14.
        next_stage_action:
          oneOf:
            - $ref: "#/components/schemas/RecruitmentNextStageAction"
            - type: "null"
        stage_entered_at:
          type: string
        signed_at:
          type: ["string", "null"]
        created_at:
          type: string
        updated_at:
          type: string

    RecruitmentDetail:
      allOf:
        - $ref: "#/components/schemas/Recruitment"
        - type: object
          required: [why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, signals, history]
          properties:
            why_it_fits:
              type: string
            why_now:
              type: string
            suggested_angle:
              type: ["string", "null"]
            suggested_target_role:
              type: ["string", "null"]
            priority_rationale:
              type: ["string", "null"]
            enterprise_access:
              type: boolean
            relevant_capability:
              type: boolean
            technology_adjacency:
              type: boolean
            partnership_openness:
              type: boolean
            recent_trigger:
              type: boolean
            signals:
              type: array
              items:
                $ref: "#/components/schemas/Signal"
            history:
              type: array
              items:
                $ref: "#/components/schemas/RecruitmentHistoryItem"
            existing_partner_context:
              $ref: "#/components/schemas/ExistingPartnerContext"

    ExistingPartnerContext:
      type: object
      description: Read-only Stage 6 Portfolio context surfaced on Recruitment/Radar detail views when the underlying company is known. Never used to auto-create or auto-reopen anything.
      properties:
        relationship:
          oneOf:
            - type: object
              required: [id, status]
              properties:
                id:
                  type: string
                status:
                  type: string
                territory_name:
                  type: ["string", "null"]
                assigned_user_name:
                  type: ["string", "null"]
            - type: "null"

    RecruitmentHistoryItem:
      type: object
      required: [id, to_stage, created_at]
      properties:
        id:
          type: string
        from_stage:
          oneOf:
            - $ref: "#/components/schemas/RecruitmentStage"
            - type: "null"
        to_stage:
          $ref: "#/components/schemas/RecruitmentStage"
        note:
          type: ["string", "null"]
        actor_name:
          type: ["string", "null"]
        created_at:
          type: string

    TransitionRecruitmentInput:
      type: object
      required: [to_stage]
      properties:
        to_stage:
          $ref: "#/components/schemas/RecruitmentStage"
        note:
          type: ["string", "null"]
          description: Optional short note explaining the transition. Recorded on the history row.
        not_pursuing_reason:
          oneOf:
            - $ref: "#/components/schemas/NotPursuingReason"
            - type: "null"
          description: Required when to_stage is not_pursuing.

    UpdateRecruitmentInput:
      type: object
      properties:
        next_step:
          type: ["string", "null"]
        follow_up_date:
          type: ["string", "null"]

    ChannelRadarConfig:
      type: object
      required: [id, territory_id, active, monitored_entities, enabled_signal_types, lookback_days]
      properties:
        id:
          type: string
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        active:
          type: boolean
        monitored_entities:
          type: array
          items:
            type: string
        enabled_signal_types:
          type: array
          items:
            type: string
        lookback_days:
          type: number

    CreateChannelRadarConfigInput:
      type: object
      required: [territory_id]
      properties:
        territory_id:
          type: string

    UpdateChannelRadarConfigInput:
      type: object
      properties:
        active:
          type: boolean
        monitored_entities:
          type: array
          items:
            type: string
        enabled_signal_types:
          type: array
          items:
            type: string
        lookback_days:
          type: number
          minimum: 1

    ChannelRadarEntityType:
      type: string
      enum: [competitor, partner, ecosystem, other]

    ChannelRadarSignalType:
      type: string
      enum: [acquisition, partnership, reseller_distributor, regional_expansion, leadership_hire, funding, customer_win, product_gtm, marketplace_listing, event, other]

    ChannelRadarImplication:
      type: string
      enum: [opportunity, threat, neutral]

    ChannelRadarImpact:
      type: string
      enum: [high, medium, low]

    ChannelRadarConfidence:
      type: string
      enum: [high, medium, low]

    ChannelRadarSignalStatus:
      type: string
      enum: [new, reviewed, dismissed]

    ChannelRadarSignal:
      type: object
      required: [id, territory_id, entity_name, entity_type, signal_type, headline, summary, why_it_matters, implication, impact, recommended_action, confidence, source_title, source_url, discovered_at, status, created_at, updated_at]
      properties:
        id:
          type: string
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        entity_name:
          type: string
        entity_type:
          $ref: "#/components/schemas/ChannelRadarEntityType"
        signal_type:
          $ref: "#/components/schemas/ChannelRadarSignalType"
        headline:
          type: string
        summary:
          type: string
        why_it_matters:
          type: string
        implication:
          $ref: "#/components/schemas/ChannelRadarImplication"
        impact:
          $ref: "#/components/schemas/ChannelRadarImpact"
        recommended_action:
          type: string
        confidence:
          $ref: "#/components/schemas/ChannelRadarConfidence"
        source_title:
          type: string
        source_url:
          type: string
        source_domain:
          type: ["string", "null"]
        source_published_at:
          type: ["string", "null"]
          description: Nullable -- never fabricated when the source provider gave no publish date.
        discovered_at:
          type: string
        status:
          $ref: "#/components/schemas/ChannelRadarSignalStatus"
        created_at:
          type: string
        updated_at:
          type: string
        existing_partner_context:
          $ref: "#/components/schemas/ExistingPartnerContext"

    UpdateChannelRadarSignalInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ChannelRadarSignalStatus"

    RunChannelRadarInput:
      type: object
      required: [territory_id]
      properties:
        territory_id:
          type: string

    RunChannelRadarResult:
      type: object
      required: [results_found, results_qualified, message]
      properties:
        results_found:
          type: number
        results_qualified:
          type: number
        message:
          type: string

    SearchResultModule:
      type: string
      enum: [portfolio, recruitment, discovery, radar]

    SearchResult:
      type: object
      required: [id, module, company_name, domain, context_label, territory_name, href]
      properties:
        id:
          type: string
          description: The underlying record's id (relationship/recruitment/prospect/radar signal), not the company's.
        module:
          $ref: "#/components/schemas/SearchResultModule"
        company_name:
          type: string
        domain:
          type: ["string", "null"]
        context_label:
          type: string
          description: e.g. "Portfolio Partner · Romania", "Recruitment · Engaged", "Discovery Prospect · Priority A", "Radar Signal · Acquisition"
        territory_name:
          type: ["string", "null"]
        href:
          type: string
          description: The module's list page -- v1 navigates to the module, not a deep link to this specific record.

    PamCopilotChatBody:
      type: object
      required: [message, period]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        period:
          $ref: "#/components/schemas/KpiPeriod"
        pam_user_id:
          type: ["string", "null"]
          description: Head/Admin only -- explicitly drill into this PAM's own territory context. Ignored for a PAM caller, who is always forced to their own identity server-side.
        company_id:
          type: ["string", "null"]
          description: Optional current-record context (e.g. the partner detail view the PAM has open). Must resolve to a company already present in the caller's authorized territory, or the Copilot reports it as not found.

    PamCopilotEvidenceItem:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string

    PamCopilotChatResponse:
      type: object
      required: [answer, evidence, suggested_route, follow_ups]
      properties:
        answer:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/PamCopilotEvidenceItem"
          description: >-
            Compact stored-fact references the answer relies on, e.g. a
            label of "Q3 Signed Partners target" with value "5". Empty when
            the answer doesn't hinge on specific supplied facts.
        suggested_route:
          type: ["string", "null"]
          description: A real in-app route the PAM could navigate to next (e.g. "/recruitment"), or null.
        follow_ups:
          type: array
          items:
            type: string
          description: Up to 4 short suggested next questions, as plain text only -- never an executable action.

    SaturationState:
      type: string
      enum: [unexplored, exploring, productive, slowing, saturated, insufficient_data]

    PotentialBand:
      type: string
      enum: [low, medium, high, insufficient_data]

    TerritoryPotentialSummary:
      type: object
      required:
        - territory_id
        - territory_name
        - discovered_company_count
        - qualified_prospect_count
        - accepted_prospect_count
        - available_prospect_count
        - existing_partner_count
        - active_recruitment_count
        - recent_new_company_count
        - recent_unique_company_count
        - duplicate_rate
        - new_candidate_yield
        - discovery_runs_count
        - last_discovery_at
        - saturation_state
        - potential_band
        - saturation_interpretation
      properties:
        territory_id:
          type: string
        territory_name:
          type: string
        discovered_company_count:
          type: integer
          description: Distinct companies with at least one Discovery prospect ever created in this territory.
        qualified_prospect_count:
          type: integer
          description: Total prospects ever persisted for this territory (persistence only happens for candidates that already passed the 5-check qualification bar).
        accepted_prospect_count:
          type: integer
