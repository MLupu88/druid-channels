          description: From the most recent live (dataStatus=connected) Discovery run with real search-productivity stats. Null when no such run exists yet.
        recent_unique_company_count:
          type: ["integer", "null"]
        duplicate_rate:
          type: ["number", "null"]
          description: Fraction (0-1) of the most recent live run's raw results that were duplicates (already-known company or in-run repeat).
        new_candidate_yield:
          type: ["number", "null"]
          description: Fraction (0-1) of the most recent live run's raw results that were genuinely new companies.
