    UserEditInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        territory:
          type: ["string", "null"]
          description: Deprecated display-only override. Prefer territory_id/new_territory_name, which also update the canonical territories.owner_user_id and recompute this field server-side.
        territory_id:
          type: ["string", "null"]
          description: Assign this PAM as the canonical owner of an existing, currently-unowned territory. 409 if it is already owned by someone else. If this PAM currently owns a different territory, that ownership is released automatically (one PAM owns one territory).
        new_territory_name:
          type: ["string", "null"]
          description: Create a brand-new canonical territory with this name and assign this PAM as its owner. Mutually exclusive with territory_id.
        location_label:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
          description: Must be a valid IANA zone name if provided; validated server-side.
        active:
          type: boolean

    CreateUserInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        territory:
          type: ["string", "null"]
          description: Deprecated display-only override. Prefer territory_id/new_territory_name, which also set the canonical territories.owner_user_id and recompute this field server-side.
        territory_id:
          type: ["string", "null"]
          description: Assign this new PAM as the canonical owner of an existing, currently-unowned territory. 409 if it is already owned by someone else.
        new_territory_name:
          type: ["string", "null"]
          description: Create a brand-new canonical territory with this name and assign this new PAM as its owner. Mutually exclusive with territory_id.
        location_label:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
          description: Must be a valid IANA zone name if provided; validated server-side.
        password:
          type: string
          minLength: 16
          description: Initial access credential for the new PAM. Hashed server-side; never stored or returned in plaintext.

