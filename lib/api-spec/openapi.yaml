    KpiPeriod:
      type: string
      pattern: "^\\d{4}-(q1|q2|q3|q4|ytd)$"
      example: "2026-q3"
      description: Stage 6.3 -- composite "<year>-<quarterKey>" period identity used throughout the KPI/reporting/PPTX/targets stack (never a bare "q3", which would collide across years). Invalid/missing values resolve server-side to the current year + current quarter.

    MetricTarget:
      type: object
      required: [id, metric_key, period, territory_id, territory_name, pam_user_id, pam_name, target_value, note, created_by_name, updated_by_name, updated_at]
      properties:
        id:
          type: string
        metric_key:
          type: string
        period:
          $ref: "#/components/schemas/KpiPeriod"
        territory_id:
          type: ["string", "null"]
        territory_name:
          type: string
        pam_user_id:
          type: ["string", "null"]
          description: Nullable only for legacy pre-6.2 rows that could not be safely assigned a canonical PAM (see the Stage 6.2 report). Every row created/updated from 6.2 onward always has one.
        pam_name:
          type: ["string", "null"]
        target_value:
          type: number
        note:
          type: ["string", "null"]
        created_by_name:
          type: ["string", "null"]
        updated_by_name:
          type: ["string", "null"]
        updated_at:
          type: string

    MetricTargetInput:
      type: object
      required: [metric_key, period, territory_id, pam_user_id, target_value]
      properties:
        metric_key:
          type: string
          description: Must be one of the curated targetable metrics (see TARGETABLE_METRIC_KEYS) -- 404 otherwise.
        period:
          $ref: "#/components/schemas/KpiPeriod"
        territory_id:
          type: string
        pam_user_id:
          type: string
          description: Must be the canonical owner of territory_id (territories.owner_user_id) -- 400 otherwise. Explicit and validated, never silently derived or swapped.
        target_value:
          type: number
          minimum: 0
          description: No KPI in this product has a meaningful negative target.
        note:
          type: ["string", "null"]

    TeamTargetStatus:
      type: string
      enum: [ahead, behind, no_target]

    TeamTargetRow:
      type: object
      required: [pam_user_id, pam_name, territory_id, territory_name, metric_key, metric_label, target_value, target_id, actual_value, progress_percent, status]
      properties:
        pam_user_id:
          type: string
        pam_name:
          type: string
        territory_id:
          type: string
        territory_name:
          type: string
        metric_key:
          type: string
        metric_label:
          type: string
        target_value:
          type: ["number", "null"]
        target_id:
          type: ["string", "null"]
          description: Set when a target row already exists for this PAM/territory/metric/period -- null means "no target set", used by Team Targets to offer create-vs-edit.
        actual_value:
          type: ["number", "null"]
          description: From the same canonical KPI computation Overview uses -- never recomputed separately.
        progress_percent:
          type: ["number", "null"]
          description: Null when there is no target to measure progress against -- never computed as if target were 0.
        status:
          $ref: "#/components/schemas/TeamTargetStatus"

    AnnualTarget:
      type: object
      required: [id, metric_key, year, target_value, note, created_by_name, updated_by_name, updated_at]
      properties:
        id:
          type: string
        metric_key:
          type: string
        year:
          type: number
        target_value:
          type: number
        note:
          type: ["string", "null"]
        created_by_name:
          type: ["string", "null"]
        updated_by_name:
          type: ["string", "null"]
        updated_at:
          type: string

    AnnualTargetInput:
      type: object
      required: [metric_key, year, target_value]
      properties:
        metric_key:
          type: string
          description: Must be one of the curated targetable metrics (see TARGETABLE_METRIC_KEYS) -- 404 otherwise.
        year:
          type: number
        target_value:
          type: number
          minimum: 0
          description: The company-wide annual figure. Never automatically divided by four -- PAM quarterly allocations are separate rows, compared against this via GET /metric-targets/annual-cascade.
        note:
          type: ["string", "null"]

    PamAllocation:
      type: object
      required: [pam_user_id, pam_name, territory_id, territory_name, q1, q2, q3, q4]
      properties:
        pam_user_id:
          type: string
        pam_name:
          type: string
        territory_id:
          type: string
        territory_name:
          type: string
        q1:
          type: ["number", "null"]
        q2:
          type: ["number", "null"]
        q3:
          type: ["number", "null"]
        q4:
          type: ["number", "null"]

    QuarterlyAllocationTotals:
      type: object
      required: [q1, q2, q3, q4]
      properties:
        q1:
          type: number
        q2:
          type: number
        q3:
          type: number
        q4:
          type: number

    AnnualCascade:
      type: object
      required: [metric_key, year, annual_target, allocated_to_pams, unallocated_amount, overallocated_amount, quarterly_totals, actual, attainment_percent, allocations]
      properties:
        metric_key:
          type: string
        year:
          type: number
        annual_target:
          type: ["number", "null"]
        allocated_to_pams:
          type: number
          description: Sum of every PAM's own q1-q4 allocation rows -- never derived by dividing annual_target by four.
        unallocated_amount:
          type: ["number", "null"]
          description: max(0, annual_target - allocated_to_pams). Null only when there is no annual_target to measure against.
        overallocated_amount:
          type: number
          description: max(0, allocated_to_pams - annual_target). Zero whenever allocations do not exceed the annual target.
        quarterly_totals:
          $ref: "#/components/schemas/QuarterlyAllocationTotals"
        actual:
          type: ["number", "null"]
          description: Company-wide actual performance for the year to date. For closed_revenue this is the credit-aware figure (credit_value/credit_date when present on a won opportunity, otherwise deal_value/closed_at) -- it can differ from the closed_revenue reporting KPI.
        attainment_percent:
          type: ["number", "null"]
          description: round(actual / annual_target * 100). Null when there is no annual_target to measure against.
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/PamAllocation"

    AiBriefState:
