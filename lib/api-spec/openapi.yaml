          type: string
          minLength: 1
        company_id:
          type: string
        territory_id:
          type: string
        assigned_user_id:
          type: string
        attribution_type:
          $ref: "#/components/schemas/OpportunityAttributionType"
        status:
          $ref: "#/components/schemas/OpportunityStatus"
          description: Defaults to "open". status=won requires closed_at to be set in the same request.
        deal_value:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          enum: [USD, EUR, GBP]
          default: USD
        opportunity_date:
          type: string
          description: The real business date the opportunity was opened. Must be set honestly even for a backfilled historical record -- never defaulted to today.
        expected_close_date:
          type: ["string", "null"]
        closed_at:
          type: ["string", "null"]
          description: Required when status=won.
        credit_value:
          type: ["number", "null"]
          description: Must be positive when present.
        credit_date:
          type: ["string", "null"]
        customer_name:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        source_system:
          $ref: "#/components/schemas/OpportunitySourceSystem"
          description: Defaults to "manual".
        external_id:
          type: ["string", "null"]
        source_updated_at:
          type: ["string", "null"]

    OpportunityEditInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        company_id:
          type: string
        territory_id:
          type: string
          description: A PAM may never change this away from their own canonical territory (cannot widen scope).
        assigned_user_id:
          type: string
          description: A PAM may never change this to a different PAM (no reassignment).
        attribution_type:
          $ref: "#/components/schemas/OpportunityAttributionType"
        status:
          $ref: "#/components/schemas/OpportunityStatus"
          description: status=won requires closed_at (existing or provided in the same request).
        deal_value:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          enum: [USD, EUR, GBP]
        opportunity_date:
          type: string
        expected_close_date:
          type: ["string", "null"]
        closed_at:
          type: ["string", "null"]
        credit_value:
          type: ["number", "null"]
        credit_date:
          type: ["string", "null"]
        customer_name:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        source_system:
          $ref: "#/components/schemas/OpportunitySourceSystem"
        external_id:
          type: ["string", "null"]
        source_updated_at:
          type: ["string", "null"]

    PartnerResearchItem:
      type: object
      required: [id, category, source_kind, title, summary, is_possible_customer_opening, discovered_at]
