openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DRUID Partner Radar Lite API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: territories
    description: Territory management
  - name: prospects
    description: Partner prospect operations
  - name: scan-configs
    description: Scan configuration management
  - name: scan-runs
    description: Scan run operations
  - name: kpis
    description: KPI and head-of-channels metrics
  - name: campaigns
    description: Activities (joint campaigns, events, webinars) management
  - name: partners
    description: Existing partner research briefings
  - name: auth
    description: Email/password login, current-session lookup, and logout
  - name: connections
    description: Third-party connection admin (HubSpot, web search/reader, AI)
  - name: metric-mappings
    description: Map each KPI to a data source, with preview-before-save
  - name: metric-targets
    description: Management-configured KPI targets, independent of how each metric's actual value is computed
  - name: exports
    description: Quarterly report export
  - name: ai-channel-brief
    description: AI-generated executive brief for the Overview page, built from a controlled snapshot of trusted KPI data
  - name: recruitment
    description: Stage 4 native partner recruitment -- the operational process from an accepted Discovery prospect to Signed
  - name: channel-radar
    description: Stage 5 Channel Radar -- regional competitive/ecosystem intelligence, separate from Discovery and Recruitment
  - name: portfolio
    description: Stage 6 Partner Portfolio -- the persistent Company+Territory partner relationship, converging Discovery/Recruitment, PAM book import, and manual add
  - name: portfolio-import
    description: Stage 6 PAM Portfolio book import -- Excel/CSV/pasted-text ingestion, deterministic+DeepSeek normalization, and PAM review before canonical records are created
  - name: companies
    description: Lightweight canonical-company lookup, used by Portfolio manual add and import review to find/reuse an existing company
  - name: search
    description: Stage 6.3 internal application search across every module
  - name: pam-copilot
    description: Stage 6.4 PAM Workspace Copilot -- grounded, read-only Q&A over a controlled snapshot of the caller's own workspace and a maintained App Guide
  - name: territory-potential
    description: Stage 6.5 Territory Potential -- deterministic, count-based Discovery capacity/saturation summary per territory. Context for target setting, never target automation.
  - name: opportunities
    description: Phase 5A -- the commercial deal ledger (partner_opportunities). Backs pipeline, closed revenue, and opportunities-created reporting, and the credit-aware annual target attainment cascade.

paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Verify email + password and issue a signed session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          description: Invalid email or password

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the user for the current session token
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the client's local session (tokens are stateless; this is a no-op acknowledgement)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new PAM (role is always pam; not caller-assignable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
        "409":
          description: Email already in use

  /territories:
    get:
      operationId: listTerritories
      tags: [territories]
      summary: List all territories
      responses:
        "200":
          description: List of territories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Territory"
    post:
      operationId: createTerritory
      tags: [territories]
      summary: Create a new canonical territory. Head of Channels/admin only. Immediately available everywhere GET /territories is read (Discovery, Recruitment, Channel Radar, Portfolio, Settings).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTerritoryInput"
      responses:
        "200":
          description: The created territory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Territory"
        "400":
          description: Missing/invalid name
        "409":
          description: A territory with this name already exists

  /prospects:
    get:
      operationId: listProspects
      tags: [prospects]
      summary: List partner prospects with optional filters
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: pam_user_id
          in: query
          schema:
            type: ["string", "null"]
        - name: priority
          in: query
          schema:
            type: ["string", "null"]
        - name: partner_type
          in: query
          schema:
            type: ["string", "null"]
        - name: signal_type
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: next_action
          in: query
          schema:
            type: ["string", "null"]
        - name: freshness
          in: query
          description: Freshness is based on the territory scan config recency window.
          schema:
            type: ["string", "null"]
            enum: [fresh, stale, null]
      responses:
        "200":
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prospect"

  /prospects/{id}:
    get:
      operationId: getProspect
      tags: [prospects]
      summary: Get a single prospect with signals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prospect detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProspect
      tags: [prospects]
      summary: Edit prospect fields (notes, messaging, assignment, priority)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectEditInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found
    delete:
      operationId: deleteProspect
      tags: [prospects]
      summary: Delete a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /prospects/{id}/decision:
    post:
      operationId: makeProspectDecision
      tags: [prospects]
      summary: Accept, reject, or defer a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectDecisionInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found

  /prospects/{id}/hubspot:
    post:
      operationId: pushProspectToHubspot
      tags: [prospects]
      summary: Push an accepted prospect to HubSpot (mock)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HubSpot push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubspotPushResult"
        "400":
          description: Prospect not accepted
        "404":
          description: Not found

  /recruitment:
    get:
      operationId: listRecruitments
      tags: [recruitment]
      summary: List partner recruitments with optional filters (PAM sees only their own territory; Head of Channels/admin sees all)
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: pam_user_id
          in: query
          schema:
            type: ["string", "null"]
        - name: stage
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of recruitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recruitment"

  /recruitment/{id}:
    get:
      operationId: getRecruitment
      tags: [recruitment]
      summary: Get a recruitment's full detail, including Discovery context, evidence, and stage history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recruitment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruitmentDetail"
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found
    patch:
      operationId: updateRecruitment
      tags: [recruitment]
      summary: Lightweight edit of next_step / follow_up_date (does not change stage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecruitmentInput"
      responses:
        "200":
          description: Updated recruitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recruitment"
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found

  /recruitment/{id}/transition:
    post:
      operationId: transitionRecruitment
      tags: [recruitment]
      summary: Move a recruitment to a new stage. Transition validity is enforced server-side -- the frontend cannot set an arbitrary stage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRecruitmentInput"
      responses:
        "200":
          description: Recruitment after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recruitment"
        "400":
          description: Invalid transition for the recruitment's current stage, or a required field (e.g. not_pursuing_reason) is missing
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found

  /channel-radar-configs:
    get:
      operationId: listChannelRadarConfigs
      tags: [channel-radar]
      summary: List Channel Radar configs (PAM sees only their own territory; Head of Channels/admin sees all)
      responses:
        "200":
          description: List of Channel Radar configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelRadarConfig"
    post:
      operationId: createChannelRadarConfig
      tags: [channel-radar]
      summary: Create the Channel Radar config for a territory that doesn't have one yet (Head of Channels/admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRadarConfigInput"
      responses:
        "201":
          description: Created Channel Radar config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelRadarConfig"
        "404":
          description: Territory not found
        "409":
          description: A Channel Radar config already exists for this territory

  /channel-radar-configs/{id}:
    get:
      operationId: getChannelRadarConfig
      tags: [channel-radar]
      summary: Get a Channel Radar config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel Radar config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelRadarConfig"
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found
    patch:
      operationId: updateChannelRadarConfig
      tags: [channel-radar]
      summary: Update monitored entities, signal types, lookback, or active state (Head of Channels/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRadarConfigInput"
      responses:
        "200":
          description: Updated Channel Radar config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelRadarConfig"
        "404":
          description: Not found

  /channel-radar:
    get:
      operationId: listChannelRadarSignals
      tags: [channel-radar]
      summary: List Channel Radar signals with optional filters (PAM sees only their own territory; Head of Channels/admin sees all)
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: signal_type
          in: query
          schema:
            type: ["string", "null"]
        - name: implication
          in: query
          schema:
            type: ["string", "null"]
        - name: impact
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of Channel Radar signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelRadarSignal"

  /channel-radar/{id}:
    get:
      operationId: getChannelRadarSignal
      tags: [channel-radar]
      summary: Get a Channel Radar signal's full detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel Radar signal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelRadarSignal"
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found
    patch:
      operationId: updateChannelRadarSignal
      tags: [channel-radar]
      summary: Update a signal's status (new -> reviewed; new/reviewed -> dismissed). Transition validity is enforced server-side.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRadarSignalInput"
      responses:
        "200":
          description: Updated signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelRadarSignal"
        "400":
          description: Invalid status transition
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found

  /channel-radar/run:
    post:
      operationId: runChannelRadar
      tags: [channel-radar]
      summary: Execute one manual Channel Radar scan for a territory's active config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunChannelRadarInput"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunChannelRadarResult"
        "400":
          description: No active config for this territory, or the provider(s) are not connected
        "403":
          description: Outside caller's authorized scope
        "404":
          description: No Channel Radar config exists yet for this territory
        "500":
          description: Scan failed after starting (provider call failed mid-run)

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Stage 6.3 internal application search across Companies/Portfolio/Recruitment/Discovery/Channel Radar. Deterministic case-insensitive name/domain/entity matching -- no external search provider, no fuzzy AI matching. A PAM's results are hard-scoped server-side to their own canonical territory (never client-filtered).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching results across every searchable module, most relevant module groups first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: Query shorter than the minimum length

  /pam-copilot/chat:
    post:
      operationId: chatWithPamCopilot
      tags: [pam-copilot]
      summary: Stage 6.4 PAM Workspace Copilot. Read-only, grounded Q&A over a controlled context snapshot (never raw SQL, never unrestricted DB access) built from the caller's own canonical territory, or -- for Head/Admin only -- an explicitly specified PAM's territory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PamCopilotChatBody"
      responses:
        "200":
          description: Grounded answer, with optional compact evidence references and a suggested next route/follow-ups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PamCopilotChatResponse"
        "400":
          description: Empty/invalid message, or a Head/Admin caller omitted pam_user_id
        "403":
          description: Caller has no canonical territory, or (PAM only) attempted to specify a different pam_user_id/territory than their own
        "404":
          description: Specified pam_user_id has no canonical territory
        "502":
          description: AI provider call failed or is not configured

  /territory-potential:
    get:
      operationId: getTerritoryPotential
      tags: [territory-potential]
      summary: Deterministic Territory Potential summaries. Head/Admin sees all owned territories (or one, via ?territory=); a PAM always sees exactly their own regardless of ?territory=, which is never read for a non-global caller.
      parameters:
        - name: territory
          in: query
          description: Head/Admin only -- territory id or name to scope to a single summary. Ignored for a PAM caller.
          schema:
            type: string
      responses:
        "200":
          description: Always an array -- one entry for a PAM or a scoped Head/Admin request, one entry per owned territory otherwise
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TerritoryPotentialSummary"
        "403":
          description: Caller has no canonical territory assigned
        "404":
          description: Head/Admin requested a ?territory= that doesn't exist

  /companies/search:
    get:
      operationId: searchCompanies
      tags: [companies]
      summary: Lightweight canonical-company lookup by name/domain, for the Portfolio manual-add and import-review company picker
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching companies (bounded, exact/prefix match only -- no fuzzy search)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyRef"

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Aggregate Portfolio cards (Active Partners, New Partners in period, In Recruitment, Needs Attention) for the Irina/global view. PAM sees only their own territory.
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio:
    get:
      operationId: listPortfolio
      tags: [portfolio]
      summary: List Partner Relationships with optional filters (PAM sees only their own territory; Head of Channels/admin sees all)
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: pam_user_id
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of Partner Relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerRelationship"
    post:
      operationId: createPortfolioRelationship
      tags: [portfolio]
      summary: Manual Add -- create a Partner Relationship directly, resolving/creating its canonical company deterministically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRelationshipInput"
      responses:
        "200":
          description: The relationship (existing, unchanged, if one already existed for this company+territory)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRelationship"
        "400":
          description: Missing company reference, or a new company is missing a required field (e.g. country)
        "403":
          description: Outside caller's authorized scope

  /portfolio/{id}:
    get:
      operationId: getPortfolioRelationship
      tags: [portfolio]
      summary: Get a Partner Relationship's full detail, including history, activities, and related Discovery/Recruitment/Radar context
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Partner Relationship detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRelationshipDetail"
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found
    patch:
      operationId: updatePortfolioRelationship
      tags: [portfolio]
      summary: Edit relationship summary/type/tier/next action (does not change status or owner)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortfolioRelationshipInput"
      responses:
        "200":
          description: Updated relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRelationship"
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found

  /portfolio/{id}/status:
    post:
      operationId: transitionPortfolioStatus
      tags: [portfolio]
      summary: Move a relationship to a new status (active/dormant/closed). Transition validity is enforced server-side.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionPortfolioStatusInput"
      responses:
        "200":
          description: Relationship after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRelationship"
        "400":
          description: Invalid transition for the relationship's current status
        "403":
          description: Outside caller's authorized scope
        "404":
          description: Not found

  /portfolio/{id}/reassign:
    post:
      operationId: reassignPortfolioRelationship
      tags: [portfolio]
      summary: Reassign ownership to a different PAM. Head of Channels/admin only -- a PAM cannot reassign their own or any other relationship. The target PAM must already be the canonical owner (territories.owner_user_id) of this relationship's territory.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignPortfolioRelationshipInput"
      responses:
        "200":
          description: Relationship after reassignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRelationship"
        "400":
