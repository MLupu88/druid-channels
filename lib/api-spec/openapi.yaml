openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DRUID Partner Radar Lite API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: territories
    description: Territory management
  - name: prospects
    description: Partner prospect operations
  - name: scan-configs
    description: Scan configuration management
  - name: scan-runs
    description: Scan run operations
  - name: kpis
    description: KPI and head-of-channels metrics
  - name: campaigns
    description: Activities (joint campaigns, events, webinars) management
  - name: partners
    description: Existing partner research briefings
  - name: auth
    description: Email/password login, current-session lookup, and logout
  - name: connections
    description: Third-party connection admin (HubSpot, web search/reader, AI)
  - name: metric-mappings
    description: Map each KPI to a data source, with preview-before-save
  - name: exports
    description: Quarterly report export

paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Verify email + password and issue a signed session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          description: Invalid email or password

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the user for the current session token
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the client's local session (tokens are stateless; this is a no-op acknowledgement)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /territories:
    get:
      operationId: listTerritories
      tags: [territories]
      summary: List all territories
      responses:
        "200":
          description: List of territories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Territory"

  /prospects:
    get:
      operationId: listProspects
      tags: [prospects]
      summary: List partner prospects with optional filters
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: pam_user_id
          in: query
          schema:
            type: ["string", "null"]
        - name: priority
          in: query
          schema:
            type: ["string", "null"]
        - name: partner_type
          in: query
          schema:
            type: ["string", "null"]
        - name: signal_type
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prospect"

  /prospects/{id}:
    get:
      operationId: getProspect
      tags: [prospects]
      summary: Get a single prospect with signals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prospect detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProspect
      tags: [prospects]
      summary: Edit prospect fields (notes, messaging, assignment, priority)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectEditInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found
    delete:
      operationId: deleteProspect
      tags: [prospects]
      summary: Delete a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /prospects/{id}/decision:
    post:
      operationId: makeProspectDecision
      tags: [prospects]
      summary: Accept, reject, or defer a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectDecisionInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found

  /prospects/{id}/hubspot:
    post:
      operationId: pushProspectToHubspot
      tags: [prospects]
      summary: Push an accepted prospect to HubSpot (mock)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HubSpot push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubspotPushResult"
        "400":
          description: Prospect not accepted
        "404":
          description: Not found

  /scan-configs:
    get:
      operationId: listScanConfigs
      tags: [scan-configs]
      summary: List all scan configurations
      responses:
        "200":
          description: List of scan configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanConfig"

  /scan-configs/{id}:
    get:
      operationId: getScanConfig
      tags: [scan-configs]
      summary: Get a scan configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "404":
          description: Not found
    put:
      operationId: updateScanConfig
      tags: [scan-configs]
      summary: Update a scan configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanConfigInput"
      responses:
        "200":
          description: Updated scan configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "404":
          description: Not found

  /scans/run:
    post:
      operationId: runScan
      tags: [scan-runs]
      summary: Run a scan (mock mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRunInput"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRunResult"

  /kpis/head-of-channels:
    get:
      operationId: getHeadOfChannelsKpis
      tags: [kpis]
      summary: Get KPI tables for the Head of Channels view
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: KPI data for the three tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadOfChannelsKpis"

  /kpis/details:
    get:
      operationId: getKpiDetails
      tags: [kpis]
      summary: Get the drill-down detail for a single KPI, using the same source/period/territory as its row
      parameters:
        - name: metric_key
          in: query
          required: true
          schema:
            type: string
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: KPI drill-down detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDetail"
        "404":
          description: Unknown metric_key

  /connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List configured integration connections (HubSpot, web search, web reader, AI) with live status
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"

  /connections/{id}:
    patch:
      operationId: updateConnection
      tags: [connections]
      summary: Update a connection's non-secret configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUpdateInput"
      responses:
        "200":
          description: Updated connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "404":
          description: Not found

  /connections/{id}/test:
    post:
      operationId: testConnection
      tags: [connections]
      summary: Test a connection using its configured environment-variable credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test result (also updates the connection's stored status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "404":
          description: Not found

  /metric-mappings:
    get:
      operationId: listMetricMappings
      tags: [metric-mappings]
      summary: List every canonical KPI's data-source mapping and status
      responses:
        "200":
          description: List of metric mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricMapping"

  /metric-mappings/{metric_key}:
    put:
      operationId: upsertMetricMapping
      tags: [metric-mappings]
      summary: Save how a KPI's value should be sourced
      parameters:
        - name: metric_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricMappingInput"
      responses:
        "200":
          description: Updated mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricMapping"
        "404":
          description: Unknown metric_key

  /metric-mappings/{metric_key}/preview:
    post:
      operationId: previewMetricMapping
      tags: [metric-mappings]
      summary: Preview what a candidate mapping would produce, without saving it
      parameters:
        - name: metric_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricMappingPreviewInput"
      responses:
        "200":
          description: Preview of the resulting KPI detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDetail"

  /manual-metric-values:
    get:
      operationId: listManualMetricValues
      tags: [metric-mappings]
      summary: List manually entered KPI values
      parameters:
        - name: metric_key
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of manual metric values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualMetricValue"
    put:
      operationId: upsertManualMetricValue
      tags: [metric-mappings]
      summary: Create or update a manually entered KPI value for a metric/period/territory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualMetricValueInput"
      responses:
        "200":
          description: Saved manual value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualMetricValue"

  /exports/quarterly-pptx:
    get:
      operationId: exportQuarterlyPptx
      tags: [exports]
      summary: Export the quarterly Head of Channels report as a PowerPoint deck
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: PowerPoint file
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaign lists
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a new campaign list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Edit a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignEditInput"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edit a user's role, territory, or active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEditInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /territories/{id}:
    patch:
      operationId: updateTerritory
      tags: [territories]
      summary: Edit a territory's name or owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerritoryEditInput"
      responses:
        "200":
          description: Updated territory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Territory"
        "404":
          description: Not found

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List existing partners (accepted/pushed-to-HubSpot prospects)
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"

  /partners/{id}:
    get:
      operationId: getPartner
      tags: [partners]
      summary: Get a partner research briefing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Partner detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDetail"
        "404":
          description: Not found

  /partners/{id}/help-needed:
    patch:
      operationId: updatePartnerHelpNeeded
      tags: [partners]
      summary: Update what help a PAM needs to move a partner forward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpNeededInput"
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          description: Not found

  /prospects/stats/summary:
    get:
      operationId: getProspectStats
      tags: [prospects]
      summary: Get prospect statistics grouped by territory and status
      responses:
        "200":
          description: Prospect statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, role, territory, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [head_of_channels, pam, admin]
        territory:
          type: ["string", "null"]
        active:
          type: boolean

    Territory:
      type: object
      required: [id, name, countries, languages]
      properties:
        id:
          type: string
        name:
          type: string
        owner_user_id:
          type: ["string", "null"]
        countries:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string

    Signal:
      type: object
      required: [id, company_id, signal_type, title, summary, source_url, confidence, discovered_at]
      properties:
        id:
          type: string
        company_id:
          type: string
        signal_type:
          type: string
          enum: [partnership, ai_investment, enterprise_access, technology, hiring, event, tender]
        title:
          type: string
        summary:
          type: string
        source_url:
          type: string
        source_domain:
          type: ["string", "null"]
        published_at:
          type: ["string", "null"]
        discovered_at:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        raw_excerpt:
          type: ["string", "null"]

    Company:
      type: object
      required: [id, name, domain, country]
      properties:
        id:
          type: string
        name:
          type: string
        normalized_name:
          type: ["string", "null"]
        domain:
          type: string
        website_url:
          type: ["string", "null"]
        country:
          type: string
        headquarters:
          type: ["string", "null"]
        employee_band:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        linkedin_url:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]

    Prospect:
      type: object
      required: [id, company, territory_id, partner_type, priority, status, why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, created_at]
      properties:
        id:
          type: string
        company:
          $ref: "#/components/schemas/Company"
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          $ref: "#/components/schemas/User"
        partner_type:
          type: string
        priority:
          type: string
          enum: [A, B]
        enterprise_access:
          type: boolean
        relevant_capability:
          type: boolean
        technology_adjacency:
          type: boolean
        partnership_openness:
          type: boolean
        recent_trigger:
          type: boolean
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
        suggested_message:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, accepted, rejected, deferred, pushed_to_hubspot]
        rejection_reason:
          type: ["string", "null"]
        pam_note:
          type: ["string", "null"]
        accepted_at:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]
        signal_count:
          type: number
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]

    ProspectDetail:
      type: object
      required: [id, company, territory_id, partner_type, priority, status, why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, signals, activity, created_at]
      properties:
        id:
          type: string
        company:
          $ref: "#/components/schemas/Company"
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          $ref: "#/components/schemas/User"
        partner_type:
          type: string
        priority:
          type: string
          enum: [A, B]
        enterprise_access:
          type: boolean
        relevant_capability:
          type: boolean
        technology_adjacency:
          type: boolean
        partnership_openness:
          type: boolean
        recent_trigger:
          type: boolean
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
        suggested_message:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, accepted, rejected, deferred, pushed_to_hubspot]
        rejection_reason:
          type: ["string", "null"]
        pam_note:
          type: ["string", "null"]
        accepted_at:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]

    ActivityItem:
      type: object
      required: [id, event_type, timestamp]
      properties:
        id:
          type: string
        event_type:
          type: string
          enum: [discovered, reviewed, accepted, rejected, deferred, hubspot_pushed, note_added]
        timestamp:
          type: string
        actor_name:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    ProspectDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accepted, rejected, deferred]
        rejection_reason:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        assigned_user_id:
          type: ["string", "null"]

    HubspotPushResult:
      type: object
      required: [status, hubspot_company_id]
      properties:
        status:
          type: string
