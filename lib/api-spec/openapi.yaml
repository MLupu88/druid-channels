      tags: [portfolio-import]
      summary: Resolve ambiguity on one row before confirming -- pick/clear the matched company, edit the normalized proposal, or leave a review note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: rowId
          in: path
          required: true
          schema:
            type: string
