openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DRUID Partner Radar Lite API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: territories
    description: Territory management
  - name: prospects
    description: Partner prospect operations
  - name: scan-configs
    description: Scan configuration management
  - name: scan-runs
    description: Scan run operations
  - name: kpis
    description: KPI and head-of-channels metrics
  - name: campaigns
    description: Activities (joint campaigns, events, webinars) management
  - name: partners
    description: Existing partner research briefings
  - name: auth
    description: Email/password login, current-session lookup, and logout
  - name: connections
    description: Third-party connection admin (HubSpot, web search/reader, AI)
  - name: metric-mappings
    description: Map each KPI to a data source, with preview-before-save
  - name: metric-targets
    description: Management-configured KPI targets, independent of how each metric's actual value is computed
  - name: exports
    description: Quarterly report export
  - name: ai-channel-brief
    description: AI-generated executive brief for the Overview page, built from a controlled snapshot of trusted KPI data

paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Verify email + password and issue a signed session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          description: Invalid email or password

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the user for the current session token
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the client's local session (tokens are stateless; this is a no-op acknowledgement)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new PAM (role is always pam; not caller-assignable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
        "409":
          description: Email already in use

  /territories:
    get:
      operationId: listTerritories
      tags: [territories]
      summary: List all territories
      responses:
        "200":
          description: List of territories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Territory"

  /prospects:
    get:
      operationId: listProspects
      tags: [prospects]
      summary: List partner prospects with optional filters
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: pam_user_id
          in: query
          schema:
            type: ["string", "null"]
        - name: priority
          in: query
          schema:
            type: ["string", "null"]
        - name: partner_type
          in: query
          schema:
            type: ["string", "null"]
        - name: signal_type
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: next_action
          in: query
          schema:
            type: ["string", "null"]
        - name: freshness
          in: query
          description: Freshness is based on the territory scan config recency window.
          schema:
            type: ["string", "null"]
            enum: [fresh, stale, null]
      responses:
        "200":
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prospect"

  /prospects/{id}:
    get:
      operationId: getProspect
      tags: [prospects]
      summary: Get a single prospect with signals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prospect detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProspect
      tags: [prospects]
      summary: Edit prospect fields (notes, messaging, assignment, priority)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectEditInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found
    delete:
      operationId: deleteProspect
      tags: [prospects]
      summary: Delete a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /prospects/{id}/decision:
    post:
      operationId: makeProspectDecision
      tags: [prospects]
      summary: Accept, reject, or defer a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectDecisionInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found

  /prospects/{id}/hubspot:
    post:
      operationId: pushProspectToHubspot
      tags: [prospects]
      summary: Push an accepted prospect to HubSpot (mock)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HubSpot push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubspotPushResult"
        "400":
          description: Prospect not accepted
        "404":
          description: Not found

  /scan-configs:
    get:
      operationId: listScanConfigs
      tags: [scan-configs]
      summary: List all scan configurations
      responses:
        "200":
          description: List of scan configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanConfig"

  /scan-configs/{id}:
    get:
      operationId: getScanConfig
      tags: [scan-configs]
      summary: Get a scan configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "404":
          description: Not found
    put:
      operationId: updateScanConfig
      tags: [scan-configs]
      summary: Update a scan configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanConfigInput"
      responses:
        "200":
          description: Updated scan configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "404":
          description: Not found

  /scans/run:
    post:
      operationId: runScan
      tags: [scan-runs]
      summary: Run a discovery scan for a territory's scan config. Uses a live provider chain when web search/reader/AI connections are all configured, otherwise falls back to the deterministic demo generator (never fabricated as connected).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRunInput"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRunResult"

  /scan-runs:
    get:
      operationId: listScanRuns
      tags: [scan-runs]
      summary: List scan run history, optionally filtered by scan config, most recent first
      parameters:
        - name: scan_config_id
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Scan run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanRun"

  /kpis/head-of-channels:
    get:
      operationId: getHeadOfChannelsKpis
      tags: [kpis]
      summary: Get KPI tables for the Head of Channels view
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, EUR, GBP]
            default: USD
      responses:
        "200":
          description: KPI data for the three tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadOfChannelsKpis"

  /kpis/details:
    get:
      operationId: getKpiDetails
      tags: [kpis]
      summary: Get the drill-down detail for a single KPI, using the same source/period/territory as its row
      parameters:
        - name: metric_key
          in: query
          required: true
          schema:
            type: string
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, EUR, GBP]
            default: USD
      responses:
        "200":
          description: KPI drill-down detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDetail"
        "404":
          description: Unknown metric_key

  /connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List configured integration connections (HubSpot, web search, web reader, AI) with live status
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"

  /connections/{id}:
    patch:
      operationId: updateConnection
      tags: [connections]
      summary: Update a connection's non-secret configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUpdateInput"
      responses:
        "200":
          description: Updated connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "404":
          description: Not found

  /connections/{id}/test:
    post:
      operationId: testConnection
      tags: [connections]
      summary: Test a connection using its configured environment-variable credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test result (also updates the connection's stored status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "404":
          description: Not found

  /metric-mappings:
    get:
      operationId: listMetricMappings
      tags: [metric-mappings]
      summary: List every canonical KPI's data-source mapping and status
      responses:
        "200":
          description: List of metric mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricMapping"

  /metric-mappings/{metric_key}:
    put:
      operationId: upsertMetricMapping
      tags: [metric-mappings]
      summary: Save how a KPI's value should be sourced
      parameters:
        - name: metric_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricMappingInput"
      responses:
        "200":
          description: Updated mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricMapping"
        "404":
          description: Unknown metric_key

  /metric-mappings/{metric_key}/preview:
    post:
      operationId: previewMetricMapping
      tags: [metric-mappings]
      summary: Preview what a candidate mapping would produce, without saving it
      parameters:
        - name: metric_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricMappingPreviewInput"
      responses:
        "200":
          description: Preview of the resulting KPI detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDetail"

  /manual-metric-values:
    get:
      operationId: listManualMetricValues
      tags: [metric-mappings]
      summary: List manually entered KPI values
      parameters:
        - name: metric_key
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of manual metric values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualMetricValue"
    put:
      operationId: upsertManualMetricValue
      tags: [metric-mappings]
      summary: Create or update a manually entered KPI value for a metric/period/territory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualMetricValueInput"
      responses:
        "200":
          description: Saved manual value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualMetricValue"

  /metric-targets:
    get:
      operationId: listMetricTargets
      tags: [metric-targets]
      summary: List management-configured KPI targets. A PAM sees only their own territory plus Global; a global/admin user sees all.
      parameters:
        - name: metric_key
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of configured targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricTarget"
    put:
      operationId: upsertMetricTarget
      tags: [metric-targets]
      summary: Create or update the target for a metric/period/territory (or Global). Head of Channels/admin only -- never changes the metric's actual value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricTargetInput"
      responses:
        "200":
          description: Saved target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricTarget"
        "404":
          description: Unknown metric_key or territory_id

  /metric-targets/{id}:
    delete:
      operationId: deleteMetricTarget
      tags: [metric-targets]
      summary: Clear a configured target back to unconfigured (honest null). Head of Channels/admin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /exports/quarterly-pptx:
    get:
      operationId: exportQuarterlyPptx
      tags: [exports]
      summary: Export the quarterly Head of Channels report as a PowerPoint deck
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, EUR, GBP]
            default: USD
      responses:
        "200":
          description: PowerPoint file
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary

  /ai-channel-brief:
    get:
      operationId: getAiChannelBrief
      tags: [ai-channel-brief]
      summary: Get the current AI Channel Brief state and cached content (if any) for a period/territory/currency scope
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, EUR, GBP]
            default: USD
      responses:
        "200":
          description: Current brief state, independent of provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChannelBrief"
        "400":
          description: Invalid period/currency or other invalid request parameter
        "403":
          description: Requested territory is outside the caller's scope
        "503":
          description: FX rate unavailable for the requested currency

  /ai-channel-brief/regenerate:
    post:
      operationId: regenerateAiChannelBrief
      tags: [ai-channel-brief]
      summary: Regenerate the AI Channel Brief for a period/territory/currency scope, on demand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateAiChannelBriefInput"
      responses:
        "200":
          description: Regenerated brief, or an honest insufficient_data/stale result if there was nothing eligible to regenerate from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChannelBrief"
        "400":
          description: AI provider is not configured, or the request contains an invalid period/currency value
        "403":
          description: Requested territory is outside the caller's scope
        "502":
          description: AI provider call failed -- any previously cached brief is left untouched
        "503":
          description: FX rate unavailable for the requested currency

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaign lists
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a new campaign list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Edit a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignEditInput"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edit a user's role, territory, or active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEditInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset access for a PAM by generating a new strong temporary password, invalidating the old one, and returning it once
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Temporary password generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResetPasswordResponse"
        "400":
          description: Target user is not a PAM
        "404":
          description: Not found

  /territories/{id}:
    patch:
      operationId: updateTerritory
      tags: [territories]
      summary: Edit a territory's name or owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerritoryEditInput"
      responses:
        "200":
          description: Updated territory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Territory"
        "404":
          description: Not found

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List existing partners (accepted/pushed-to-HubSpot prospects)
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"

  /partners/{id}:
    get:
      operationId: getPartner
      tags: [partners]
      summary: Get a partner research briefing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Partner detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDetail"
        "404":
          description: Not found

  /partners/{id}/help-needed:
    patch:
      operationId: updatePartnerHelpNeeded
      tags: [partners]
      summary: Update what help a PAM needs to move a partner forward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpNeededInput"
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          description: Not found

  /prospects/stats/summary:
    get:
      operationId: getProspectStats
      tags: [prospects]
      summary: Get prospect statistics grouped by territory and status
      responses:
        "200":
          description: Prospect statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, role, territory, location_label, timezone, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [head_of_channels, pam, admin]
        territory:
          type: ["string", "null"]
