      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "404":
          description: Not found
    put:
      operationId: updateScanConfig
      tags: [scan-configs]
      summary: Update a scan configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanConfigInput"
      responses:
        "200":
          description: Updated scan configuration
