      description: Source-neutral identity, added ahead of the actual HubSpot integration (not yet implemented -- no HubSpot API calls exist anywhere in this app). "manual" is a PAM-entered row (the default); "import" is reserved for a future bulk backfill; "hubspot" is reserved for a future live sync.

    Opportunity:
      type: object
      required:
        - id
        - name
        - company_id
        - company_name
        - territory_id
        - territory_name
        - assigned_user_id
        - assigned_user_name
        - attribution_type
        - status
        - deal_value
        - currency
        - opportunity_date
        - expected_close_date
        - closed_at
        - credit_value
        - credit_date
        - customer_name
        - note
        - source_system
        - external_id
        - source_updated_at
        - last_synced_at
        - created_by_user_id
        - created_by_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        company_id:
          type: string
        company_name:
          type: string
        territory_id:
          type: string
        territory_name:
          type: string
        assigned_user_id:
          type: string
        assigned_user_name:
          type: string
        attribution_type:
          $ref: "#/components/schemas/OpportunityAttributionType"
        status:
          $ref: "#/components/schemas/OpportunityStatus"
        deal_value:
          type: number
        currency:
          type: string
          enum: [USD, EUR, GBP]
        opportunity_date:
          type: string
          description: The real business date the opportunity was opened -- never the same as created_at. May be well before app go-live for a backfilled historical record.
        expected_close_date:
          type: ["string", "null"]
        closed_at:
          type: ["string", "null"]
          description: The true business/CRM close date. Required whenever status=won. Never falsified to make a historical deal appear to close inside a later target period -- see credit_date for that.
        credit_value:
          type: ["number", "null"]
          description: Target-attainment override. When set, this amount (denominated in this row's own currency) is credited to the target period identified by credit_date instead of deal_value. Independent of the closed_revenue reporting figure, which always uses deal_value/closed_at only.
        credit_date:
          type: ["string", "null"]
          description: Target-attainment override date. When set, this opportunity's credited value lands in the target period containing credit_date instead of closed_at. closed_at is never edited to achieve this.
        customer_name:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        source_system:
          $ref: "#/components/schemas/OpportunitySourceSystem"
        external_id:
          type: ["string", "null"]
          description: Foreign record id once an import or future HubSpot sync populates this row. Null for every manually-created row.
        source_updated_at:
          type: ["string", "null"]
        last_synced_at:
          type: ["string", "null"]
        created_by_user_id:
          type: ["string", "null"]
        created_by_name:
          type: ["string", "null"]
        created_at:
          type: string
        updated_at:
          type: string

