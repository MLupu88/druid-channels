      operationId: getAiChannelBrief
      tags: [ai-channel-brief]
      summary: Get the current AI Channel Brief state and cached content (if any) for a period/territory/currency scope
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, EUR, GBP]
            default: USD
      responses:
        "200":
          description: Current brief state, independent of provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChannelBrief"
        "400":
          description: Invalid period/currency or other invalid request parameter
        "403":
          description: Requested territory is outside the caller's scope
        "503":
          description: FX rate unavailable for the requested currency

  /ai-channel-brief/regenerate:
    post:
      operationId: regenerateAiChannelBrief
      tags: [ai-channel-brief]
      summary: Regenerate the AI Channel Brief for a period/territory/currency scope, on demand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateAiChannelBriefInput"
      responses:
        "200":
          description: Regenerated brief, or an honest insufficient_data/stale result if there was nothing eligible to regenerate from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChannelBrief"
        "400":
          description: AI provider is not configured, or the request contains an invalid period/currency value
        "403":
          description: Requested territory is outside the caller's scope
        "502":
          description: AI provider call failed -- any previously cached brief is left untouched
        "503":
          description: FX rate unavailable for the requested currency

