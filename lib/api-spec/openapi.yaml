      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, EUR, GBP]
            default: USD
      responses:
        "200":
          description: PowerPoint file
          content:
