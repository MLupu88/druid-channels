          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        technologies:
          type: array
          items:
            type: string
        excluded_domains:
          type: array
          items:
            type: string
        target_signals:
          type: array
          items:
            type: string
        max_results:
          type: number
        min_checks_required:
          type: number
        recency_window_days:
          type: number
        active:
          type: boolean
        last_run:
          anyOf:
            - $ref: "#/components/schemas/ScanRun"
            - type: "null"

    CreateScanConfigInput:
      type: object
      required: [territory_id]
      properties:
        territory_id:
          type: string

    ScanConfigInput:
      type: object
      properties:
        name:
          type: string
        partner_types:
          type: array
          items:
            type: string
          description: The partner types DRUID is looking for (e.g. System Integrator, Consulting).
        industries:
          type: array
          items:
            type: string
          description: The industries DRUID is looking for.
        technologies:
          type: array
          items:
            type: string
          description: The technologies / ecosystem adjacencies DRUID is looking for (e.g. Microsoft, Genesys, UiPath).
        excluded_domains:
          type: array
          items:
            type: string
          description: Company domains to exclude from discovery.
        target_signals:
          type: array
          items:
            type: string
        search_queries:
          type: array
          items:
            type: string
          description: Explicit search queries / search intent. When empty, queries are derived automatically from industries and technologies.
        max_results:
          type: number
        min_checks_required:
          type: number
          minimum: 3
          maximum: 5
          description: >-
            Minimum number of the 5 qualification checks a candidate must pass to be surfaced as a prospect.
            Enterprise access and relevant capability are always required regardless of this setting, and
            Priority B already requires exactly 3 checks / Priority A requires at least 4 -- so values below 3
            have no additional effect, which is why 3 is the floor.
        recency_window_days:
          type: number
        active:
          type: boolean

