              schema:
                $ref: "#/components/schemas/ProspectStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, role, territory, location_label, timezone, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [head_of_channels, pam, admin]
        territory:
          type: ["string", "null"]
        location_label:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
          description: IANA zone name, e.g. "Europe/Bucharest". Null until explicitly configured -- never inferred from territory/country.
        active:
          type: boolean

    Territory:
      type: object
      required: [id, name, countries, languages]
      properties:
        id:
          type: string
        name:
          type: string
        owner_user_id:
          type: ["string", "null"]
        countries:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string

    Signal:
      type: object
      required: [id, company_id, signal_type, title, summary, source_url, confidence, discovered_at]
      properties:
        id:
          type: string
        company_id:
          type: string
        signal_type:
          type: string
          enum: [partnership, ai_investment, enterprise_access, technology, hiring, event, tender]
        title:
          type: string
        summary:
          type: string
        source_url:
          type: string
        source_domain:
          type: ["string", "null"]
        published_at:
          type: ["string", "null"]
        discovered_at:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        raw_excerpt:
          type: ["string", "null"]

    Company:
      type: object
      required: [id, name, domain, country]
      properties:
        id:
          type: string
        name:
          type: string
        normalized_name:
          type: ["string", "null"]
        domain:
          type: string
        website_url:
          type: ["string", "null"]
        country:
          type: string
        headquarters:
          type: ["string", "null"]
        employee_band:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        linkedin_url:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]

    Prospect:
      type: object
      required: [id, company, territory_id, partner_type, priority, status, why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, created_at]
      properties:
        id:
          type: string
        company:
          $ref: "#/components/schemas/Company"
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          $ref: "#/components/schemas/User"
        partner_type:
          type: string
        priority:
          type: string
          enum: [A, B]
        enterprise_access:
          type: boolean
        relevant_capability:
          type: boolean
        technology_adjacency:
          type: boolean
        partnership_openness:
          type: boolean
        recent_trigger:
          type: boolean
        priority_rationale:
          type: ["string", "null"]
          description: The literal spec-section-10 rule that produced this prospect's priority at discovery time.
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
        suggested_message:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, accepted, rejected, deferred, pushed_to_hubspot]
        rejection_reason:
          type: ["string", "null"]
        pam_note:
          type: ["string", "null"]
        accepted_at:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]
        signal_count:
          type: number
        freshness_days:
          type: ["number", "null"]
          description: Days since the most recent evidence or update on this prospect.
        is_stale:
          type: boolean
          description: freshness_days exceeds the territory's scan config recency window.
        next_action:
          $ref: "#/components/schemas/ProspectNextAction"
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]

    ProspectNextAction:
      type: string
      enum: [review, refresh_evidence, send_to_hubspot, none]

    ProspectDetail:
      type: object
      required: [id, company, territory_id, partner_type, priority, status, why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, signals, activity, created_at]
      properties:
        id:
          type: string
        company:
          $ref: "#/components/schemas/Company"
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          $ref: "#/components/schemas/User"
        partner_type:
          type: string
        priority:
          type: string
          enum: [A, B]
        enterprise_access:
          type: boolean
        relevant_capability:
          type: boolean
        technology_adjacency:
          type: boolean
        partnership_openness:
          type: boolean
        recent_trigger:
          type: boolean
        priority_rationale:
          type: ["string", "null"]
          description: The literal spec-section-10 rule that produced this prospect's priority at discovery time.
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
