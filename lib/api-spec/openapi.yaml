openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DRUID Partner Radar Lite API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: territories
    description: Territory management
  - name: prospects
    description: Partner prospect operations
  - name: scan-configs
    description: Scan configuration management
  - name: scan-runs
    description: Scan run operations
  - name: kpis
    description: KPI and head-of-channels metrics
  - name: campaigns
    description: Activities (joint campaigns, events, webinars) management
  - name: integrations
    description: Integration connection status (mocked)
  - name: partners
    description: Existing partner research briefings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /territories:
    get:
      operationId: listTerritories
      tags: [territories]
      summary: List all territories
      responses:
        "200":
          description: List of territories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Territory"

  /prospects:
    get:
      operationId: listProspects
      tags: [prospects]
      summary: List partner prospects with optional filters
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: pam_user_id
          in: query
          schema:
            type: ["string", "null"]
        - name: priority
          in: query
          schema:
            type: ["string", "null"]
        - name: partner_type
          in: query
          schema:
            type: ["string", "null"]
        - name: signal_type
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prospect"

  /prospects/{id}:
    get:
      operationId: getProspect
      tags: [prospects]
      summary: Get a single prospect with signals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prospect detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProspect
      tags: [prospects]
      summary: Edit prospect fields (notes, messaging, assignment, priority)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectEditInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found
    delete:
      operationId: deleteProspect
      tags: [prospects]
      summary: Delete a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /prospects/{id}/decision:
    post:
      operationId: makeProspectDecision
      tags: [prospects]
      summary: Accept, reject, or defer a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectDecisionInput"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found

  /prospects/{id}/hubspot:
    post:
      operationId: pushProspectToHubspot
      tags: [prospects]
      summary: Push an accepted prospect to HubSpot (mock)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HubSpot push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubspotPushResult"
        "400":
          description: Prospect not accepted
        "404":
          description: Not found

  /scan-configs:
    get:
      operationId: listScanConfigs
      tags: [scan-configs]
      summary: List all scan configurations
      responses:
        "200":
          description: List of scan configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanConfig"

  /scan-configs/{id}:
    get:
      operationId: getScanConfig
      tags: [scan-configs]
      summary: Get a scan configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "404":
          description: Not found
    put:
      operationId: updateScanConfig
      tags: [scan-configs]
      summary: Update a scan configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanConfigInput"
      responses:
        "200":
          description: Updated scan configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "404":
          description: Not found

  /scans/run:
    post:
      operationId: runScan
      tags: [scan-runs]
      summary: Run a scan (mock mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRunInput"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRunResult"

  /kpis/head-of-channels:
    get:
      operationId: getHeadOfChannelsKpis
      tags: [kpis]
      summary: Get KPI tables for the Head of Channels view
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
        - name: period
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: KPI data for the three tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadOfChannelsKpis"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaign lists
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a new campaign list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Edit a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignEditInput"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edit a user's role, territory, or active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEditInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /territories/{id}:
    patch:
      operationId: updateTerritory
      tags: [territories]
      summary: Edit a territory's name or owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerritoryEditInput"
      responses:
        "200":
          description: Updated territory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Territory"
        "404":
          description: Not found

  /integrations/status:
    get:
      operationId: getIntegrationsStatus
      tags: [integrations]
      summary: Get mocked integration connection status (HubSpot, etc.)
      responses:
        "200":
          description: Integration statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsStatus"

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List existing partners (accepted/pushed-to-HubSpot prospects)
      parameters:
        - name: territory
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"

  /partners/{id}:
    get:
      operationId: getPartner
      tags: [partners]
      summary: Get a partner research briefing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Partner detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDetail"
        "404":
          description: Not found

  /partners/{id}/help-needed:
    patch:
      operationId: updatePartnerHelpNeeded
      tags: [partners]
      summary: Update what help a PAM needs to move a partner forward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpNeededInput"
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          description: Not found

  /prospects/stats/summary:
    get:
      operationId: getProspectStats
      tags: [prospects]
      summary: Get prospect statistics grouped by territory and status
      responses:
        "200":
          description: Prospect statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, role, territory, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [head_of_channels, pam, admin]
        territory:
          type: ["string", "null"]
        active:
          type: boolean

    Territory:
      type: object
      required: [id, name, countries, languages]
      properties:
        id:
          type: string
        name:
          type: string
        owner_user_id:
          type: ["string", "null"]
        countries:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string

    Signal:
      type: object
      required: [id, company_id, signal_type, title, summary, source_url, confidence, discovered_at]
      properties:
        id:
          type: string
        company_id:
          type: string
        signal_type:
          type: string
          enum: [partnership, ai_investment, enterprise_access, technology, hiring, event, tender]
        title:
          type: string
        summary:
          type: string
        source_url:
          type: string
        source_domain:
          type: ["string", "null"]
        published_at:
          type: ["string", "null"]
        discovered_at:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        raw_excerpt:
          type: ["string", "null"]

    Company:
      type: object
      required: [id, name, domain, country]
      properties:
        id:
          type: string
        name:
          type: string
        normalized_name:
          type: ["string", "null"]
        domain:
          type: string
        website_url:
          type: ["string", "null"]
        country:
          type: string
        headquarters:
          type: ["string", "null"]
        employee_band:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        linkedin_url:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]

    Prospect:
      type: object
      required: [id, company, territory_id, partner_type, priority, status, why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, created_at]
      properties:
        id:
          type: string
        company:
          $ref: "#/components/schemas/Company"
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          $ref: "#/components/schemas/User"
        partner_type:
          type: string
        priority:
          type: string
          enum: [A, B]
        enterprise_access:
          type: boolean
        relevant_capability:
          type: boolean
        technology_adjacency:
          type: boolean
        partnership_openness:
          type: boolean
        recent_trigger:
          type: boolean
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
        suggested_message:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, accepted, rejected, deferred, pushed_to_hubspot]
        rejection_reason:
          type: ["string", "null"]
        pam_note:
          type: ["string", "null"]
        accepted_at:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]
        signal_count:
          type: number
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]

    ProspectDetail:
      type: object
      required: [id, company, territory_id, partner_type, priority, status, why_it_fits, why_now, enterprise_access, relevant_capability, technology_adjacency, partnership_openness, recent_trigger, signals, activity, created_at]
      properties:
        id:
          type: string
        company:
          $ref: "#/components/schemas/Company"
        territory_id:
          type: string
        territory_name:
          type: ["string", "null"]
        assigned_user:
          $ref: "#/components/schemas/User"
        partner_type:
          type: string
        priority:
          type: string
          enum: [A, B]
        enterprise_access:
          type: boolean
        relevant_capability:
          type: boolean
        technology_adjacency:
          type: boolean
        partnership_openness:
          type: boolean
        recent_trigger:
          type: boolean
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
        suggested_message:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, accepted, rejected, deferred, pushed_to_hubspot]
        rejection_reason:
          type: ["string", "null"]
        pam_note:
          type: ["string", "null"]
        accepted_at:
          type: ["string", "null"]
        hubspot_company_id:
          type: ["string", "null"]
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]

    ActivityItem:
      type: object
      required: [id, event_type, timestamp]
      properties:
        id:
          type: string
        event_type:
          type: string
          enum: [discovered, reviewed, accepted, rejected, deferred, hubspot_pushed, note_added]
        timestamp:
          type: string
        actor_name:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    ProspectDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accepted, rejected, deferred]
        rejection_reason:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        assigned_user_id:
          type: ["string", "null"]

    HubspotPushResult:
      type: object
      required: [status, hubspot_company_id]
      properties:
        status:
          type: string
          enum: [mock_success, success, error]
        hubspot_company_id:
          type: string
        message:
          type: ["string", "null"]

    ScanConfig:
      type: object
      required: [id, territory_id, territory_name, name, partner_types, industries, technologies, excluded_domains, target_signals, max_results, active]
      properties:
        id:
          type: string
        territory_id:
          type: string
        territory_name:
          type: string
        name:
          type: string
        search_queries:
          type: array
          items:
            type: string
        partner_types:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        technologies:
          type: array
          items:
            type: string
        excluded_domains:
          type: array
          items:
            type: string
        target_signals:
          type: array
          items:
            type: string
        max_results:
          type: number
        min_checks_required:
          type: number
        recency_window_days:
          type: number
        active:
          type: boolean

    ScanConfigInput:
      type: object
      properties:
        name:
          type: string
        partner_types:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        technologies:
          type: array
          items:
            type: string
        excluded_domains:
          type: array
          items:
            type: string
        target_signals:
          type: array
          items:
            type: string
        max_results:
          type: number
        min_checks_required:
          type: number
        recency_window_days:
          type: number
        active:
          type: boolean

    ProspectEditInput:
      type: object
      properties:
        why_it_fits:
          type: string
        why_now:
          type: string
        suggested_angle:
          type: ["string", "null"]
        suggested_target_role:
          type: ["string", "null"]
        suggested_message:
          type: ["string", "null"]
        pam_note:
          type: ["string", "null"]
        priority:
          type: string
          enum: [A, B]
        assigned_user_id:
          type: ["string", "null"]

    DeleteResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean

    UserEditInput:
      type: object
      properties:
        role:
          type: string
          enum: [head_of_channels, pam, admin]
        territory:
          type: ["string", "null"]
        active:
          type: boolean

    TerritoryEditInput:
      type: object
      properties:
        name:
          type: string
        owner_user_id:
          type: ["string", "null"]

    IntegrationConnectionStatus:
      type: object
      required: [id, name, connected, mode, records_synced, last_sync_at]
      properties:
        id:
          type: string
        name:
          type: string
        connected:
          type: boolean
        mode:
          type: string
          enum: [mock, live]
        records_synced:
          type: number
        last_sync_at:
          type: ["string", "null"]
        description:
          type: ["string", "null"]

    IntegrationsStatus:
      type: object
      required: [integrations]
      properties:
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationConnectionStatus"

    ScanRunInput:
      type: object
      required: [scan_config_id, mode]
      properties:
        scan_config_id:
          type: string
        mode:
          type: string
          enum: [mock, live]

    ScanRunResult:
      type: object
      required: [scan_run_id, status, results_found, results_qualified]
      properties:
        scan_run_id:
          type: string
        status:
          type: string
          enum: [completed, failed, running]
        results_found:
          type: number
        results_qualified:
          type: number
        message:
          type: ["string", "null"]

    KpiRow:
      type: object
      required: [metric, current, target, status]
      properties:
        metric:
          type: string
        current:
          type: number
        target:
          type: number
        status:
          type: string
          enum: [green, amber, red, on_track]
        what_changed:
          type: ["string", "null"]
        explanation:
          type: ["string", "null"]
        data_source:
          type: ["string", "null"]
        last_updated:
          type: ["string", "null"]

    WeeklyKpiRow:
      type: object
      required: [metric, current, last_week, target, trend]
      properties:
        metric:
          type: string
        current:
          type: number
        last_week:
          type: number
        target:
          type: number
        trend:
          type: string
          enum: [up, down, flat]
        explanation:
          type: ["string", "null"]
        data_source:
          type: ["string", "null"]
        last_updated:
          type: ["string", "null"]

    MarketingKpiRow:
      type: object
      required: [metric, this_week, trend]
      properties:
        metric:
          type: string
        this_week:
          type: number
        last_week:
          type: ["number", "null"]
        trend:
          type: string
          enum: [up, down, flat]
        explanation:
          type: ["string", "null"]
        data_source:
          type: ["string", "null"]
        last_updated:
          type: ["string", "null"]

    HeadOfChannelsKpis:
      type: object
      required: [partner_development, weekly_commercial, weekly_marketing, period, territory, updated_at]
      properties:
        partner_development:
          type: array
          items:
            $ref: "#/components/schemas/KpiRow"
        weekly_commercial:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyKpiRow"
        weekly_marketing:
          type: array
          items:
            $ref: "#/components/schemas/MarketingKpiRow"
        period:
          type: string
        territory:
          type: string
        updated_at:
          type: string

    Campaign:
      type: object
      required: [id, name, type, territory, owner_user_id, owner_name, status, mqls, partner_referrals, created_at]
      properties:
        id:
          type: string
