server {
    listen 8080;
    server_name _;

    # Hides this container's nginx version. Production responses still carry
    # the outer Nginx Proxy Manager's own `Server: openresty` header, which is
    # outside this repo.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Local Docker Compose only: routes /api/* to the api-server container
    # over the shared druid-channels-internal network. In production this
    # container never sees /api/* traffic at all -- Nginx Proxy Manager
    # (external to this repo) intercepts it upstream and routes directly to
    # druid-channels-api, so this block is dormant/unreachable there and
    # only activates when nothing else is in front (bare local `docker
    # compose up`). No security headers are added here: the API sets its own
    # (see artifacts/api-server/src/lib/httpSecurity.ts).
    location /api/ {
        proxy_pass http://druid-channels-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Baseline SPA headers. Kept inside this location (not at server level)
    # so they never stack on top of the API's own headers in the /api/ block
    # above; `always` keeps them on 4xx/5xx too. The CSP only restricts
    # framing, <base> and plugins -- a full script/style/connect CSP needs a
    # separate audit (runtime-injected <style> tags, Google Fonts, time.now).
    # HSTS belongs at the TLS terminator (Nginx Proxy Manager), not here.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        try_files $uri $uri/ /index.html;
    }
}
