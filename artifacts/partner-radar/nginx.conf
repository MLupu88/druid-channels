server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Local Docker Compose only: routes /api/* to the api-server container
    # over the shared druid-channels-internal network. In production this
    # container never sees /api/* traffic at all -- Nginx Proxy Manager
    # (external to this repo) intercepts it upstream and routes directly to
    # druid-channels-api, so this block is dormant/unreachable there and
    # only activates when nothing else is in front (bare local `docker
    # compose up`).
    location /api/ {
        proxy_pass http://druid-channels-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
